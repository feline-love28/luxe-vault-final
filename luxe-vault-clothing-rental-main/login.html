<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Sign In — LUXE VAULT</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

    <!-- NAVBAR -->
    <header class="navbar" id="site-header">
        <div class="container navbar-container">
            <a href="index.html" class="brand-logo">
                <div class="logo-icon">💎</div>
                <span>LUXE <span class="accent">VAULT</span></span>
            </a>

            <button class="mobile-toggle" aria-label="Toggle Menu">☰</button>

            <nav class="nav-menu" id="nav-menu">
                <a href="index.html" class="nav-link">Home</a>
                <a href="products.html" class="nav-link">Browse Catalog</a>
                <a href="index.html#how-it-works" class="nav-link">How It Works</a>
                <a href="about.html" class="nav-link">About Us</a>
                <a href="contact.html" class="nav-link">Contact Us</a>
                <a href="my-rentals.html" class="nav-link">My Rentals</a>
            </nav>

            <div class="nav-actions" id="nav-actions">
                <a href="login.html" class="btn btn-outline btn-sm">Login</a>
                <a href="register.html" class="btn btn-primary btn-sm">Register</a>
            </div>
        </div>
    </header>

    <!-- AUTH SECTION -->
    <main class="main-content auth-wrapper">
        <div class="auth-card">
            <div class="auth-header">
                <a href="index.html" class="brand-logo auth-logo">
                    <div class="logo-icon">💎</div>
                    <span>LUXE <span class="accent">VAULT</span></span>
                </a>
                <h2>Welcome Back</h2>
                <p>Sign in to your Luxe Vault account to manage rentals</p>
            </div>

            <!-- Error/Success Alert Box -->
            <div id="auth-alert" class="alert"></div>

            <form id="login-form" autocomplete="on">
                <div class="form-group">
                    <label for="email" class="form-label">Email Address</label>
                    <input type="email" id="email" class="form-control" placeholder="name@example.com" required autofocus>
                </div>

                <div class="form-group">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" id="password" class="form-control" placeholder="••••••••" required>
                </div>

                <div class="form-extra">
                    <label class="remember-me">
                        <input type="checkbox" id="rememberMe">
                        <span>Remember me</span>
                    </label>
                    <a href="#" onclick="alert('Demo Feature: A password reset link will be emailed to you.'); return false;" class="link-gold">Forgot password?</a>
                </div>

                <button type="submit" class="btn btn-primary btn-lg btn-full">Sign In to Vault</button>
            </form>

            <div class="auth-footer">
                Don't have an account? <a href="register.html" class="link-gold">Create a Vault Account</a>
            </div>
        </div>
    </main>

    <!-- JavaScript Files -->
    <script src="js/mock-data.js"></script>
    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
