<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Vault Account — LUXE VAULT</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

    <!-- NAVBAR -->
    <header class="navbar" id="site-header">
        <div class="container navbar-container">
            <a href="index.html" class="brand-logo">
                <div class="logo-icon">💎</div>
                <span>LUXE <span class="accent">VAULT</span></span>
            </a>

            <button class="mobile-toggle" aria-label="Toggle Menu">☰</button>

            <nav class="nav-menu" id="nav-menu">
                <a href="index.html" class="nav-link">Home</a>
                <a href="products.html" class="nav-link">Browse Catalog</a>
                <a href="index.html#how-it-works" class="nav-link">How It Works</a>
                <a href="about.html" class="nav-link">About Us</a>
                <a href="contact.html" class="nav-link">Contact Us</a>
                <a href="my-rentals.html" class="nav-link">My Rentals</a>
            </nav>

            <div class="nav-actions" id="nav-actions">
                <a href="login.html" class="btn btn-outline btn-sm">Login</a>
                <a href="register.html" class="btn btn-primary btn-sm">Register</a>
            </div>
        </div>
    </header>

    <!-- AUTH SECTION -->
    <main class="main-content auth-wrapper">
        <div class="auth-card auth-card-wide">
            <div class="auth-header">
                <a href="index.html" class="brand-logo auth-logo">
                    <div class="logo-icon">💎</div>
                    <span>LUXE <span class="accent">VAULT</span></span>
                </a>
                <h2>Create Your Vault Account</h2>
                <p>Join Luxe Vault to start renting premium designer outfits</p>
            </div>

            <!-- Error/Success Alert Box -->
            <div id="auth-alert" class="alert"></div>

            <form id="register-form">
                <div class="form-row">
                    <div class="form-group">
                        <label for="fullName" class="form-label">Full Name</label>
                        <input type="text" id="fullName" class="form-control" placeholder="Aarav Sharma" required>
                    </div>

                    <div class="form-group">
                        <label for="email" class="form-label">Email Address</label>
                        <input type="email" id="email" class="form-control" placeholder="aarav@example.com" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="phone" class="form-label">Phone Number</label>
                        <input type="tel" id="phone" class="form-control" placeholder="+91 98765 43210" required>
                    </div>

                    <div class="form-group">
                        <label for="address" class="form-label">Shipping / Delivery Address</label>
                        <input type="text" id="address" class="form-control" placeholder="House/Flat No., Street, City, State" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" id="password" class="form-control" placeholder="Min. 6 characters" required>
                    </div>

                    <div class="form-group">
                        <label for="confirmPassword" class="form-label">Confirm Password</label>
                        <input type="password" id="confirmPassword" class="form-control" placeholder="Re-enter password" required>
                    </div>
                </div>

                <div class="form-group" style="margin-bottom: 1.5rem;">
                    <label class="remember-me">
                        <input type="checkbox" id="termsCheckbox" required>
                        <span>I agree to the Luxe Vault <a href="#" onclick="alert('Terms & Conditions: Rental duration is strictly calculated based on agreed booking dates.'); return false;" class="link-gold">Terms of Service & Rental Agreement</a></span>
                    </label>
                </div>

                <button type="submit" class="btn btn-accent btn-lg btn-full">Create Account</button>
            </form>

            <div class="auth-footer">
                Already have an account? <a href="login.html" class="link-gold">Sign In</a>
            </div>
        </div>
    </main>

    <!-- JavaScript Files -->
    <script src="js/mock-data.js"></script>
    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
