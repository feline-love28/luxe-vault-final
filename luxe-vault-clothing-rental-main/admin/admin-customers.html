<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Directory — LUXE VAULT Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/admin.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>
<body class="admin-body">

    <div class="admin-layout" id="admin-customers-view">
        <!-- SIDEBAR -->
        <aside class="admin-sidebar">
            <div class="admin-sidebar-header">
                <a href="../index.html" class="brand-logo" style="color:white; font-size:1.2rem;">
                    <div class="logo-icon">💎</div>
                    <span>LUXE <span class="accent">VAULT</span></span>
                </a>
            </div>

            <nav class="admin-menu">
                <a href="admin-dashboard.html" class="admin-menu-item">
                    <span>📊 Dashboard</span>
                </a>
                <a href="admin-clothes.html" class="admin-menu-item">
                    <span>👗 Clothes Inventory</span>
                </a>
                <a href="admin-customers.html" class="admin-menu-item active">
                    <span>👥 Customers</span>
                </a>
                <a href="admin-rentals.html" class="admin-menu-item">
                    <span>📦 Rentals & Orders</span>
                </a>
                <a href="admin-payments.html" class="admin-menu-item">
                    <span>💳 Payments Ledger</span>
                </a>
            </nav>

            <div class="admin-sidebar-footer">
                <a href="../index.html" class="btn btn-outline btn-sm btn-full" style="color:#ebdcd5; border-color:rgba(255,255,255,0.2);">Exit to Storefront</a>
            </div>
        </aside>

        <!-- MAIN -->
        <div class="admin-main">
            <header class="admin-header">
                <h1 class="admin-page-title">Registered Customer Accounts</h1>
            </header>

            <main class="admin-content">
                <div class="table-card">
                    <div class="table-header-bar">
                        <h3 style="font-size:1.1rem; font-weight:800;">Customer Directory</h3>
                    </div>
                    <div class="table-responsive">
                        <table class="admin-table">
                            <thead>
                                <tr>
                                    <th>Customer ID</th>
                                    <th>Full Name & Address</th>
                                    <th>Email</th>
                                    <th>Phone</th>
                                    <th>Joined Date</th>
                                    <th>Status</th>
                                </tr>
                            </thead>
                            <tbody id="customers-table-tbody">
                                <!-- Populated dynamically by admin.js -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- JavaScript Files -->
    <script src="../js/mock-data.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/app.js"></script>
    <script src="../js/admin.js"></script>
</body>
</html>
